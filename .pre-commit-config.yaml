repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        # Keep this environment's cache separate from .venv / CI checks.
        args: ["--cache-dir=tmp/mypy_cache/pre-commit"]
        # Tests/docs are not mypy targets; source, config and dependency changes are.
        files: ^(src/.*\.pyi?$|pyproject\.toml$|requirements[^/]*\.(txt|lock)$|\.pre-commit-config\.yaml$)
        language: python
        additional_dependencies:
          - mypy>=1.18.0,<2.0
          - types-PyYAML>=6.0.12.20250915
        pass_filenames: false
