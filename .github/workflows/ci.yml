name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: windows-latest

    env:
      PYTHONPATH: src
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-dev.lock -e ".[dev]"

      - name: Show tool versions
        run: |
          python --version
          python -m ruff --version
          python -m mypy --version
          python -c "import numpy; print('numpy', numpy.__version__)"

      - name: Isort check
        run: python -m isort . --check-only

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy --no-incremental

  unit:
    name: Unit tests
    runs-on: windows-latest
    needs: lint

    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-dev.lock -e ".[dev,tagging-cpu]"

      - name: Pytest with coverage (unit)
        env:
          KOE_HEADLESS: "1"
        run: python -m coverage run -m pytest -p no:cov

      - name: Pytest with coverage (gui/smoke append)
        run: python -m coverage run --append -m pytest -m "gui or smoke" -p no:cov

      - name: Coverage summary
        if: always()
        run: |
          "## Coverage" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          python -m coverage report --format=markdown | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Coverage report (fail_under gate)
        run: python -m coverage report

      - name: Coverage xml
        if: always()
        run: python -m coverage xml -o coverage.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  integration:
    name: Integration tests
    runs-on: windows-latest
    needs: lint

    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-dev.lock -e ".[dev,tagging-cpu]"

      - name: Pytest integration
        run: python -m pytest -m "integration and not gpu" -p no:cov

  gui-smoke:
    name: GUI smoke tests
    runs-on: windows-latest
    needs: lint

    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-dev.lock -e ".[dev,tagging-cpu]"

      - name: Pytest GUI smoke
        run: python -m pytest -m "gui or smoke" -p no:cov

  db-stress:
    name: DB stress tests
    runs-on: windows-latest
    timeout-minutes: 20
    needs: lint

    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-dev.lock -e ".[dev,tagging-cpu]"

      - name: Pytest DB stress
        run: python -m pytest -m db_stress -p no:cov

  package-smoke:
    name: Package smoke
    runs-on: windows-latest
    needs:
      - unit
      - integration
      - gui-smoke
      - db-stress

    env:
      PYTHONPATH: src
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-dev.lock -e ".[dev,tagging-cpu]"

      - name: Compile package
        run: python -m compileall -q src tools
